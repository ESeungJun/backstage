name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 태그와 VERSION 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "v$(cat VERSION)" = "$GITHUB_REF_NAME" ] || { echo "::error::VERSION($(cat VERSION))과 태그($GITHUB_REF_NAME)가 다릅니다"; exit 1; }

      # 서명 인증서·공증 키는 이 단계에서만 쓰고 끝나면 지운다
      - name: 빌드 · 서명 · 공증
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$MAC_CERT_P12" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::macOS 서명용 Secrets 가 없습니다 (set-mac-signing-secrets 로 등록)"; exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 24)
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'security delete-keychain "$keychain" 2>/dev/null; rm -f "$RUNNER_TEMP/cert.p12" "$key"' EXIT
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          SIGN_IDENTITY=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [ -n "$SIGN_IDENTITY" ] || { echo "::error::Developer ID Application 인증서를 찾지 못했습니다"; exit 1; }
          export SIGN_IDENTITY

          ./build.sh
          notarize() { xcrun notarytool submit "$1" --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m; }

          # 1) 앱을 공증받고 티켓을 붙인다 (dmg 밖으로 꺼내도 오프라인에서 열리게)
          ditto -c -k --keepParent build/Backstage.app build/Backstage.zip
          notarize build/Backstage.zip
          xcrun stapler staple build/Backstage.app

          # 2) Applications 바로가기가 든 dmg 를 만들어 서명·공증
          mkdir -p build/dmg && cp -R build/Backstage.app build/dmg/ && ln -s /Applications build/dmg/Applications
          hdiutil create -volname Backstage -srcfolder build/dmg -ov -format UDZO build/Backstage.dmg
          codesign --force --timestamp --sign "$SIGN_IDENTITY" build/Backstage.dmg
          notarize build/Backstage.dmg
          xcrun stapler staple build/Backstage.dmg

      - name: 서명·공증 확인
        run: |
          codesign --verify --deep --strict build/Backstage.app
          xcrun stapler validate build/Backstage.app
          xcrun stapler validate build/Backstage.dmg
          spctl --assess --type execute -vv build/Backstage.app
          spctl --assess --type open --context context:primary-signature -vv build/Backstage.dmg

      - name: 릴리스
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/Backstage.dmg build/Backstage-macOS.dmg
          gh release create "$GITHUB_REF_NAME" build/Backstage-macOS.dmg \
            --title "Backstage $GITHUB_REF_NAME" --generate-notes
